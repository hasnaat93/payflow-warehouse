[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payflow-warehouse"
version = "0.1.0"
description = "Batch ELT pipeline and dimensional warehouse for synthetic payment operations data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hasnat Ahmed" }]
dependencies = ["duckdb>=1.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pfw = "pfw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pfw = ["sql/*.sql", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
